buildscript {
    repositories {
        google()           // 下载 Android Gradle 插件
        mavenCentral()     // 备用仓库
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()           // 下载 androidx、material 等
        mavenCentral()     // 下载 okhttp 等
        maven { url 'https://jitpack.io' }   // 下载 mpandroidchart（必须）
    }
}