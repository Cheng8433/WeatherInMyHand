# 启用 AndroidX
android.useAndroidX=true
# 把旧 support 库的依赖重写为 AndroidX 等价物（历史遗留，保留以兼容老的第三方 AAR）
android.enableJetifier=true

# Gradle 守护进程内存：release 构建要跑 R8 全量压缩/混淆，默认 512m 堆不够，
# 会以 "Gradle build daemon has been stopped: JVM garbage collector is thrashing" 中断。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
