apply plugin: 'com.android.application'

// 读取本机 release 签名配置（keystore.properties 不入库，见 .gitignore）。
// 文件缺失时 release 退回未签名构建，方便他人/CI 无签名编译。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('app/keystore.properties')
def hasSigning = keystorePropertiesFile.exists()
if (hasSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.smog.weatherapp'
    compileSdk 34

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.smog.weatherapp"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.0.6"
        buildConfigField "String", "BACK_HOST_API", "\"https://118.178.147.156/api/\""
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 上线包开 R8：压缩 + 资源裁剪 + 混淆。规则见 app/proguard-rules.pro，
            // 内含 AnyChart/@JavascriptInterface/自定义 View 的保留项。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.AnyChart:AnyChart-Android:1.1.2'

    // 本地 JVM 单测（testImplementation，不会打进 APK）。跑法：./gradlew :app:testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}