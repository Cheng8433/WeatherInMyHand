# ====== Web ======
server.port=8080

# ====== H2 数据库（文件持久化，数据存于 backend/data/smogdb.mv.db，已在 .gitignore） ======
spring.datasource.url=jdbc:h2:file:./data/smogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# file 库仍需显式 update，否则默认 create-drop 会在重启时清空 schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# H2 控制台默认【关闭】：生产暴露有被注入/泄露风险。
# 本地开发需控制台与 DEBUG 日志时，请以 dev profile 启动：
#     java -jar xxx.jar --spring.profiles.active=dev
spring.h2.console.enabled=false

# ====== 和风天气 Ed25519 私钥路径 ======
# 优先级：环境变量 PRIVATE_PEM_PATH（或 backend/.env）> 本配置 > 默认文件名。
# 相对路径基于“运行目录”与“运行目录/backend”两处解析（见 JwtUtil.resolvePrivateKeyPath）。
private.pem.path = ${PRIVATE_PEM_PATH:ed25519-private.pem}

# ====== 接口限流（内存固定窗口，单位：次/分钟）======
# 防止公网接口被他人刷爆和风上游配额。两层：按客户端 IP + 全局合计。
# 正常单手机使用远低于默认值；超限返回 {success:false, message}（HTTP 200，契约不变）。
rate.limit.per-ip-per-minute=30
rate.limit.global-per-minute=120

# ====== 日志 ======
# 输出目标（控制台 + 按天/按大小滚动的文件）改由 logback-spring.xml 定义，
# 这里只保留级别；Spring Boot 会在加载日志配置后按 logging.level.* 覆盖 logger 级别。
logging.level.root=INFO
logging.level.com.smog.service=INFO

# 说明：已删除失效的 hefeng.weather.key / baidu.map.key 占位键；
# 和风天气认证走 JwtUtil 的 Ed25519 JWT，百度地图未使用。
