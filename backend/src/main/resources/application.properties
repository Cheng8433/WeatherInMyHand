# ====== Web ======
server.port=8080

# ====== H2 数据库（文件持久化，数据存于 backend/data/smogdb.mv.db，已在 .gitignore） ======
spring.datasource.url=jdbc:h2:file:./data/smogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# file 库仍需显式 update，否则默认 create-drop 会在重启时清空 schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# H2 控制台（另开端口，避免与业务冲突）
spring.h2.console.enabled=true
spring.h2.console.port=8082

# ====== 和风天气 Ed25519 私钥路径 ======
# 优先级：环境变量 PRIVATE_PEM_PATH（或 backend/.env）> 本配置 > 默认文件名。
# 相对路径基于“运行目录”与“运行目录/backend”两处解析（见 JwtUtil.resolvePrivateKeyPath）。
private.pem.path = ${PRIVATE_PEM_PATH:ed25519-private.pem}

# ====== 日志 ======
logging.level.root=INFO
logging.level.com.smog.service=DEBUG
logging.file.name=logs/weather-app.log

# 说明：已删除失效的 hefeng.weather.key / baidu.map.key 占位键；
